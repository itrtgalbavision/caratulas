<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Portadas y Canciones 1:1 JPG</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #202024;
      --accent: #1db954;
      --text: #ffffff;
      --text-muted: #a8a8b3;
      --link-btn: #323238;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .badge {
      display: inline-block;
      background: #2e2e35;
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 0.4rem;
    }

    .search-container {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: 1px solid #323238;
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button.search-btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.search-btn:hover {
      opacity: 0.9;
    }

    #loading {
      display: none;
      margin: 1.5rem 0;
      color: var(--accent);
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      object-fit: cover;
      background-color: #000;
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-weight: bold;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.2rem;
    }

    .card-artist, .card-album {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .download-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--accent);
      color: #000;
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .song-link-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--link-btn);
      color: var(--text);
      text-decoration: none;
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      transition: background-color 0.2s, color 0.2s;
    }

    .song-link-btn:hover {
      background-color: #44444c;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Buscador de Portadas y Canciones</h1>
    <div>
      <span class="badge">JPG 1:1 HD</span>
      <span class="badge">Link a la Canción</span>
    </div>
  </header>

  <div class="search-container">
    <input 
      type="text" 
      id="search-input" 
      placeholder="Escribe canción o artista (ej: Daft Punk, Bad Bunny)..." 
      autofocus
    />
    <button class="search-btn" id="search-btn">Buscar</button>
  </div>

  <div id="loading">Buscando...</div>

  <main class="grid" id="results-grid"></main>

  <script>
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const resultsGrid = document.getElementById('results-grid');
    const loading = document.getElementById('loading');

    window.itunesCallback = function(data) {
      loading.style.display = 'none';
      resultsGrid.innerHTML = '';

      if (!data.results || data.results.length === 0) {
        resultsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No se encontraron resultados.</p>';
        return;
      }

      data.results.forEach(item => {
        if (!item.artworkUrl100) return;

        const hdCoverUrl = item.artworkUrl100.replace('100x100bb', '1400x1400bb');
        const songName = item.trackName || item.collectionName || 'Canción';
        const artistName = item.artistName || 'Artista';
        const fileName = `${artistName} - ${songName}`.replace(/[/\\?%*:|"<>]/g, '-');
        
        // Link directo a la canción en Apple Music (o al álbum si no hay track individual)
        const songLink = item.trackViewUrl || item.collectionViewUrl || '#';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${hdCoverUrl}" alt="Cover" loading="lazy" />
          <div class="card-info">
            <div class="card-title" title="${songName}">${songName}</div>
            <div class="card-artist" title="${artistName}">${artistName}</div>
            <div class="card-album" title="${item.collectionName || ''}">${item.collectionName || ''}</div>
          </div>
          <div class="actions-container">
            <button class="download-btn" onclick="saveAsJpg('${hdCoverUrl}', '${fileName}', this)">
              Descargar JPG 1:1
            </button>
            <a href="${songLink}" target="_blank" rel="noopener noreferrer" class="song-link-btn">
              🔗 Abrir canción
            </a>
          </div>
        `;
        resultsGrid.appendChild(card);
      });
    };

    function searchCovers() {
      const query = searchInput.value.trim();
      if (!query) return;

      loading.style.display = 'block';

      const oldScript = document.getElementById('itunes-jsonp');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'itunes-jsonp';
      script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=24&callback=itunesCallback`;
      
      script.onerror = () => {
        loading.style.display = 'none';
        alert('Error al conectar con el servicio.');
      };

      document.body.appendChild(script);
    }

    function saveAsJpg(imgUrl, filename, btn) {
      btn.innerText = 'Descargando...';

      const proxiedUrl = `https://images.weserv.nl/?url=${encodeURIComponent(imgUrl)}&output=jpg&q=100`;

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = proxiedUrl;

      img.onload = () => {
        const size = Math.min(img.naturalWidth, img.naturalHeight);
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, size, size);

        const sx = (img.naturalWidth - size) / 2;
        const sy = (img.naturalHeight - size) / 2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, size, size);

        canvas.toBlob((blob) => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${filename}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          btn.innerText = 'Descargar JPG 1:1';
        }, 'image/jpeg', 1.0);
      };

      img.onerror = () => {
        window.open(imgUrl, '_blank');
        btn.innerText = 'Descargar JPG 1:1';
      };
    }

    searchBtn.addEventListener('click', searchCovers);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchCovers();
    });
  </script>
</body>
</html>
